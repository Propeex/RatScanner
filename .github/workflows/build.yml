name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - main
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path "RatScanner/RatScanner.csproj" -XPath "/Project/PropertyGroup/Version").Node.InnerText
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish
        run: dotnet publish RatScanner/RatScanner.csproj -c Release -o publish -p:PublishSingleFile=true --runtime win-x64 --self-contained

      - name: Include data
        shell: pwsh
        run: |
          curl.exe -L "https://github.com/RatScanner/RatScannerData/releases/latest/download/Data.zip" --output "publish/Data.zip"
          7z x publish/Data.zip -opublish/Data
          Remove-Item publish/Data.zip

      - name: Include updater
        shell: pwsh
        run: curl.exe -L "https://github.com/RatScanner/RatUpdater/releases/latest/download/RatUpdater.exe" --output "publish/RatUpdater.exe"

      - name: Zip content
        run: 7z a -r RatScanner.zip ./publish/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RatScanner-${{ steps.version.outputs.version }}
          path: ./publish/

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: RatScanner v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: RatScanner.zip
