name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - main
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path "RatScanner/RatScanner.csproj" -XPath "/Project/PropertyGroup/Version").Node.InnerText
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare pinned Tarkov.dev schema
        shell: pwsh
        run: |
          $schemaUrl = "https://raw.githubusercontent.com/the-hideout/tarkov-api/edc4f1a4e98fec4b17f86f9a2cc9b7ba6f0e4c3f/schema-static.mjs"
          curl.exe --fail --location --retry 4 --retry-delay 5 $schemaUrl --output ".github/schema-server/schema-static.mjs"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download the pinned Tarkov.dev GraphQL schema."
          }

          npm install --prefix .github/schema-server --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to install the local GraphQL schema server dependency."
          }

      - name: Restore dependencies
        run: dotnet restore RatScanner/RatScanner.csproj --runtime win-x64

      - name: Publish with local GraphQL schema
        shell: pwsh
        run: |
          $schemaEndpoint = "http://127.0.0.1:43117/graphql"
          $schemaServer = Start-Process node -ArgumentList ".github/schema-server/server.mjs" -PassThru -NoNewWindow
          $publishExitCode = 1

          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 20; $attempt++) {
              try {
                $health = Invoke-WebRequest "http://127.0.0.1:43117/health" -UseBasicParsing -TimeoutSec 2
                if ($health.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }

            if (-not $ready) {
              throw "The local Tarkov.dev GraphQL schema server did not start."
            }

            dotnet publish RatScanner/RatScanner.csproj -c Release -o publish -p:PublishSingleFile=true --runtime win-x64 --self-contained --no-restore "-p:GraphQlClientGenerator_ServiceUrl=$schemaEndpoint"
            $publishExitCode = $LASTEXITCODE
          } finally {
            if ($null -ne $schemaServer -and -not $schemaServer.HasExited) {
              Stop-Process -Id $schemaServer.Id -Force
            }
          }

          exit $publishExitCode

      - name: Include data
        shell: pwsh
        run: |
          curl.exe -L "https://github.com/RatScanner/RatScannerData/releases/latest/download/Data.zip" --output "publish/Data.zip"
          7z x publish/Data.zip -opublish/Data
          Remove-Item publish/Data.zip

      - name: Include updater
        shell: pwsh
        run: curl.exe -L "https://github.com/RatScanner/RatUpdater/releases/latest/download/RatUpdater.exe" --output "publish/RatUpdater.exe"

      - name: Zip content
        run: 7z a -r RatScanner.zip ./publish/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RatScanner-${{ steps.version.outputs.version }}
          path: ./publish/

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: RatScanner v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: RatScanner.zip
