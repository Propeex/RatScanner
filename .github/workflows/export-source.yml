name: Export Source

on:
  pull_request:
    branches:
      - master

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: ratscanner-source
          path: |
            RatScanner/**
            LICENSE
          include-hidden-files: true
